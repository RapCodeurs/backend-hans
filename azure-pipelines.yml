# Le pipeline se déclenche sur les modifications de main ou des branches de fonctionnalités
trigger:
- main
- cert
- nprod

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureServiceConnection: 'hans-devops' 
  acrName: 'acrhansbackend.azurecr.io'
  imageRepository: 'backend-hans'
  dockerfilePath: '$(Build.SourcesDirectory)/dockerfile'
  tag: '$(Build.SourceVersion)'

stages:
# ==========================================
# STAGE 1 : Build, Scan et Publication de l'image
# ==========================================
- stage: BuildAndPush
  displayName: 'Build, Scan & Push'
  jobs:
  - job: BuildJob
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Install Node.js'

    - script: |
        npm ci
      displayName: 'Install Dependencies'

    - script: |
        docker run --rm -v $(pwd):/apps aquasec/trivy:latest fs /apps --severity CRITICAL --exit-code 1
      displayName: 'Scan avec Trivy (Sécurité)'

    - task: Docker@2
      displayName: 'Build and Push image to ACR'
      inputs:
        command: 'buildAndPush'
        containerRegistry: 'acr-direct-conn'
        repository: '$(imageRepository)'
        Dockerfile: '$(dockerfilePath)'
        buildContext: '$(Build.SourcesDirectory)'
        tags: |
          $(tag)
          latest

# ==========================================
# STAGE 2 : Déploiement en CERT (Recette)
# ==========================================
- stage: DeployCERT
  displayName: 'Déploiement - CERT'
  dependsOn: BuildAndPush
  # S'exécute uniquement si le build a réussi ET que nous ne sommes PAS sur la branche de production directe par erreur
  condition: succeeded()
  jobs:
  - job: Deploy
    steps:
    - script: echo "Déploiement de l'image $(imageRepository):$(tag) sur l'environnement CERT..."
      displayName: 'Script Déploiement CERT'

# ==========================================
# STAGE 3 : Déploiement en NPROD (Pré-production)
# ==========================================
- stage: DeployNPROD
  displayName: 'Déploiement - NPROD'
  dependsOn: DeployCERT
  condition: succeeded()
  jobs:
  - job: Deploy
    steps:
    - script: echo "Déploiement de l'image $(imageRepository):$(tag) sur l'environnement NPROD..."
      displayName: 'Script Déploiement NPROD'

# ==========================================
# STAGE 4 : Déploiement en PROD (Production)
# ==========================================
- stage: DeployPROD
  displayName: 'Déploiement - PROD'
  dependsOn: DeployNPROD
  # CONDITION CRITIQUE : Ne s'exécute QUE si le code a été fusionné (mergé) sur la branche main
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: Deploy
    steps:
    - script: echo "Déploiement de l'image $(imageRepository):$(tag) sur l'environnement PROD de manière sécurisée..."
      displayName: 'Script Déploiement PROD'

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Remplace par le NOM de ta Service Connection Azure créée à l'étape précédente
  azureServiceConnection: 'hans-devops' 
  # Remplace par le NOM de ton Azure Container Registry
  acrName: 'acrhansbackend.azurecr.io'
  imageRepository: 'backend-hans'
  dockerfilePath: '$**/Dockerfile'
  tag: '$(Build.SourceVersion)' # Utilise le SHA du commit comme tag

stages:
- stage: BuildAndTest
  displayName: 'Lint, Test, Scan & Build'
  jobs:
  - job: Pipeline
    steps:
    # 1. Installer Node.js et lancer les tests / lints
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Install Node.js'

    - script: |
        npm ci
        # npm run lint  # Décommente si tu as un linter configuré
        # npm test      # Décommente si tu as des tests configurés
      displayName: 'Install, Lint & Test'

    # 2. Scanner le code avec Trivy pour la sécurité
    - script: |
        docker run --rm -v $(pwd):/apps aquasec/trivy:latest fs /apps --severity CRITICAL --exit-code 1
      displayName: 'Scan avec Trivy (Sécurité)'

    # 3. Build & Push de l'image vers Azure Container Registry (ACR)
    - task: Docker@2
      displayName: 'Build and Push image to ACR'
      inputs:
        command: 'buildAndPush'
        containerRegistryType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: '$(azureServiceConnection)' 
        azureContainerRegistry: '$(acrName)'
        repository: '$(imageRepository)'
        Dockerfile: '$(dockerfilePath)'
        tags: |
          $(tag)
          latest